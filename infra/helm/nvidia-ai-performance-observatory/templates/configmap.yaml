apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nvo.fullname" . }}-config
  labels:
    {{- include "nvo.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  AUTH_ENABLED: {{ .Values.config.authEnabled | quote }}
  RATE_LIMIT_ENABLED: {{ .Values.config.rateLimitEnabled | quote }}
  RATE_LIMIT_REQUESTS: {{ .Values.config.rateLimitRequests | quote }}
  GPU_METRICS_ENABLED: {{ .Values.config.gpuMetricsEnabled | quote }}
  DCGM_ENABLED: {{ .Values.config.dcgmEnabled | quote }}
  DCGM_ENDPOINT: {{ .Values.config.dcgmEndpoint | quote }}
  TELEMETRY_INTERVAL_SECONDS: {{ .Values.config.telemetryIntervalSeconds | quote }}
  DEMO_MODE: {{ .Values.config.demoMode | quote }}
  RETENTION_RAW_DAYS: {{ .Values.config.retentionRawDays | quote }}
  RETENTION_AGGREGATED_DAYS: {{ .Values.config.retentionAggregatedDays | quote }}
  COST_PER_GPU_HOUR: {{ .Values.config.costPerGpuHour | quote }}
  COST_CURRENCY: {{ .Values.config.costCurrency | quote }}
  LLM_PROVIDER: {{ .Values.config.llmProvider | quote }}
  LLM_MODEL: {{ .Values.config.llmModel | quote }}
