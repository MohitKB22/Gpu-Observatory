{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nvo.fullname" . }}-{{ .Values.web.name }}
  labels:
    {{- include "nvo.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.web.name }}
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nvo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ .Values.web.name }}
  template:
    metadata:
      labels:
        {{- include "nvo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ .Values.web.name }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "nvo.image" (list . .Values.web) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.service.port }}
          env:
            - name: NODE_ENV
              value: production
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nvo.fullname" . }}-{{ .Values.web.name }}
  labels:
    {{- include "nvo.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.web.name }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "nvo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.web.name }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
{{- if .Values.web.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "nvo.fullname" . }}-{{ .Values.web.name }}
  labels: {{- include "nvo.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "nvo.fullname" . }}-{{ .Values.web.name }}
  minReplicas: {{ .Values.web.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.web.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.web.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.web.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "nvo.fullname" . }}-{{ .Values.web.name }}
  labels: {{- include "nvo.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.web.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "nvo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ .Values.web.name }}
{{- end }}
{{- end }}
