# Default values for the NVIDIA AI Performance Observatory chart.

nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io/example
  pullPolicy: IfNotPresent
  pullSecrets: []

api:
  enabled: true
  name: api
  image:
    repository: nvo-api
    tag: "1.0.0"
  replicaCount: 3
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  # Runs `alembic upgrade head` before the API starts.
  migrations:
    enabled: true

web:
  enabled: true
  name: web
  image:
    repository: nvo-web
    tag: "1.0.0"
  replicaCount: 2
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

telemetryAgent:
  # Deployed as a DaemonSet on GPU nodes. Disabled by default because the
  # platform must not require NVIDIA hardware to run.
  enabled: false
  name: telemetry-agent
  image:
    repository: nvo-telemetry-agent
    tag: "1.0.0"
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  intervalSeconds: 5
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 300m, memory: 384Mi }

inferenceGateway:
  enabled: false
  name: inference-gateway
  image:
    repository: nvo-inference-gateway
    tag: "1.0.0"
  replicaCount: 2
  backend: local
  baseUrl: ""
  service:
    port: 8080
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

config:
  environment: production
  logLevel: INFO
  logFormat: json
  corsOrigins: "https://observatory.example.com"
  authEnabled: true
  rateLimitEnabled: true
  rateLimitRequests: 600
  gpuMetricsEnabled: true
  dcgmEnabled: false
  dcgmEndpoint: "http://dcgm-exporter.gpu-operator:9400/metrics"
  telemetryIntervalSeconds: 5
  # Never enable Demo Mode in a production cluster: synthetic telemetry must
  # not be mistaken for real measurements.
  demoMode: false
  retentionRawDays: 7
  retentionAggregatedDays: 90
  costPerGpuHour: "2.50"
  costCurrency: USD
  llmProvider: none
  llmModel: gpt-4o-mini

# Secrets are referenced, never templated with real values. Create the secret
# out-of-band (External Secrets, Sealed Secrets, or `kubectl create secret`).
secrets:
  existingSecret: nvo-secrets
  agentSecret: nvo-agent-credentials

postgresql:
  # Prefer a managed database in production; this deploys an in-cluster
  # StatefulSet only for evaluation.
  enabled: false
  host: postgres
  port: 5432
  database: nvo
  storageSize: 50Gi

redis:
  enabled: false
  host: redis
  port: 6379
  storageSize: 10Gi

ingress:
  enabled: true
  className: nginx
  host: observatory.example.com
  tls:
    enabled: true
    secretName: nvo-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/websocket-services: "nvo-api"

serviceMonitor:
  # Requires the Prometheus Operator CRDs.
  enabled: false
  interval: 15s
  labels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
