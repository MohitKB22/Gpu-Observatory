# Prometheus scrape configuration for the Observatory stack.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    stack: nvidia-ai-performance-observatory

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The platform's own health: API latency and errors, dependency status,
  # telemetry ingestion rate and failures, agent latency, WebSocket count.
  - job_name: nvo-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: api

  - job_name: nvo-inference-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["inference-gateway:8080"]
        labels:
          component: gateway

  # dcgm-exporter, when deployed alongside real NVIDIA hardware.
  - job_name: dcgm-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["dcgm-exporter:9400"]
        labels:
          component: gpu
    # The base stack does not require NVIDIA hardware, so this target is
    # expected to be down in a default local deployment.
