groups:
  - name: observatory-platform
    interval: 30s
    rules:
      # ---- recording rules: pre-compute the expensive dashboard queries ----
      - record: nvo:api_request_rate:5m
        expr: sum(rate(nvo_http_requests_total[5m]))

      - record: nvo:api_error_ratio:5m
        expr: |
          sum(rate(nvo_http_errors_total[5m]))
          / clamp_min(sum(rate(nvo_http_requests_total[5m])), 0.001)

      - record: nvo:api_latency_p95:5m
        expr: histogram_quantile(0.95, sum(rate(nvo_http_request_duration_seconds_bucket[5m])) by (le))

      - record: nvo:inference_latency_p95:5m
        expr: histogram_quantile(0.95, sum(rate(nvo_inference_latency_seconds_bucket[5m])) by (le))

      - record: nvo:telemetry_ingest_rate:5m
        expr: sum(rate(nvo_telemetry_samples_total[5m])) by (kind)

      - record: nvo:telemetry_failure_rate:5m
        expr: sum(rate(nvo_telemetry_failures_total[5m])) by (kind)

      # ---- alerting rules ----
      - alert: NvoApiDown
        expr: up{job="nvo-api"} == 0
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "Observatory API is not reachable"
          description: "Prometheus has failed to scrape the API for more than two minutes."

      - alert: NvoApiHighErrorRate
        expr: nvo:api_error_ratio:5m > 0.05
        for: 5m
        labels:
          severity: high
          component: api
        annotations:
          summary: "API error ratio above 5%"
          description: "{{ $value | humanizePercentage }} of API requests are returning server errors."

      - alert: NvoApiHighLatency
        expr: nvo:api_latency_p95:5m > 2
        for: 10m
        labels:
          severity: medium
          component: api
        annotations:
          summary: "API P95 latency above 2s"
          description: "P95 API latency is {{ $value | humanizeDuration }}."

      - alert: NvoDependencyDown
        expr: nvo_dependency_up == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Dependency {{ $labels.dependency }} is unreachable"
          description: "The API reports {{ $labels.dependency }} as unavailable."

      - alert: NvoTelemetryIngestionStalled
        expr: |
          (time() - max(nvo_telemetry_last_success_timestamp)) > 300
        for: 5m
        labels:
          severity: high
          component: telemetry
        annotations:
          summary: "Telemetry ingestion has stalled"
          description: "No successful telemetry sweep for over five minutes."

      - alert: NvoTelemetryFailures
        expr: sum(rate(nvo_telemetry_failures_total[5m])) > 0.1
        for: 10m
        labels:
          severity: medium
          component: telemetry
        annotations:
          summary: "Telemetry collection is failing"
          description: "Collection failures are occurring at {{ $value }} per second."

      - alert: NvoAgentErrors
        expr: sum(rate(nvo_agent_errors_total[10m])) > 0.05
        for: 10m
        labels:
          severity: medium
          component: agent
        annotations:
          summary: "AI agent is erroring"
          description: "The Performance Copilot is failing; answers fall back to the rules engine."

  - name: observatory-workloads
    interval: 30s
    rules:
      - alert: NvoGpuThermalThrottling
        expr: nvo_gpu_temperature_celsius > 83
        for: 5m
        labels:
          severity: high
          component: gpu
        annotations:
          summary: "GPU {{ $labels.gpu_index }} above thermal limit"
          description: "Temperature is {{ $value }}°C; the device is likely reducing clocks."

      - alert: NvoGpuUnderUtilised
        expr: |
          avg_over_time(nvo_gpu_utilization_percent{data_source="production"}[15m]) < 40
          and on() sum(rate(nvo_inference_requests_total{data_source="production"}[15m])) > 1
        for: 15m
        labels:
          severity: medium
          component: gpu
        annotations:
          summary: "GPU {{ $labels.gpu_index }} under-utilised while serving traffic"
          description: "Utilisation is {{ $value }}% despite active inference traffic; check batching."

      - alert: NvoInferenceLatencyHigh
        expr: nvo:inference_latency_p95:5m > 1
        for: 10m
        labels:
          severity: medium
          component: inference
        annotations:
          summary: "Inference P95 latency above 1s"
          description: "P95 inference latency is {{ $value | humanizeDuration }}."
