apiVersion: 1

providers:
  - name: 'NVIDIA AI Performance Observatory'
    orgId: 1
    folder: 'Observatory'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
