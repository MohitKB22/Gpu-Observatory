# Runs on every GPU node so each reports its own hardware.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nvo-telemetry-agent
  namespace: nvo
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvo-telemetry-agent
  namespace: nvo
  labels:
    app.kubernetes.io/name: nvo-telemetry-agent
    app.kubernetes.io/component: telemetry
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvo-telemetry-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvo-telemetry-agent
    spec:
      serviceAccountName: nvo-telemetry-agent
      # Schedule only where NVIDIA hardware is actually present.
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: agent
          image: ghcr.io/example/nvo-telemetry-agent:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: NVO_API_URL
              value: http://nvo-api.nvo.svc.cluster.local:8000
            - name: NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
            - name: NVO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nvo-agent-credentials
                  key: NVO_API_KEY
            - name: TELEMETRY_INTERVAL_SECONDS
              value: "5"
            - name: DATA_SOURCE
              value: production
            - name: DCGM_ENABLED
              value: "false"
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
