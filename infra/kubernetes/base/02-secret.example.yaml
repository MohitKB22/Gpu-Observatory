# TEMPLATE ONLY — do not commit real values.
#
# Create the real secret out-of-band, for example:
#   kubectl -n nvo create secret generic nvo-secrets \
#     --from-literal=SECRET_KEY="$(openssl rand -base64 48)" \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://user:pass@host:5432/nvo' \
#     --from-literal=REDIS_URL='redis://:pass@host:6379/0' \
#     --from-literal=BOOTSTRAP_ADMIN_PASSWORD='<strong-password>'
#
# In a real cluster prefer External Secrets Operator, Sealed Secrets or a
# cloud secret manager over a literal manifest.
apiVersion: v1
kind: Secret
metadata:
  name: nvo-secrets
  namespace: nvo
  labels:
    app.kubernetes.io/part-of: nvidia-ai-performance-observatory
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_ME_WITH_A_48_BYTE_RANDOM_VALUE"
  DATABASE_URL: "postgresql+asyncpg://nvo:REPLACE_ME@postgres:5432/nvo"
  REDIS_URL: "redis://redis:6379/0"
  BOOTSTRAP_ADMIN_EMAIL: "admin@example.com"
  BOOTSTRAP_ADMIN_PASSWORD: "REPLACE_ME"
  LLM_API_KEY: ""
