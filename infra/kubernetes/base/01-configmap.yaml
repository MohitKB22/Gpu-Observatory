apiVersion: v1
kind: ConfigMap
metadata:
  name: nvo-config
  namespace: nvo
  labels:
    app.kubernetes.io/part-of: nvidia-ai-performance-observatory
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  API_V1_PREFIX: "/api/v1"
  CORS_ORIGINS: "https://observatory.example.com"
  AUTH_ENABLED: "true"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS: "600"
  SECURE_HEADERS_ENABLED: "true"

  GPU_METRICS_ENABLED: "true"
  DCGM_ENABLED: "true"
  DCGM_ENDPOINT: "http://dcgm-exporter.gpu-operator:9400/metrics"
  TELEMETRY_INTERVAL_SECONDS: "5"
  TELEMETRY_ENABLED: "true"

  # Demo Mode is OFF in production: synthetic telemetry must never be mistaken
  # for real measurements in a live environment.
  DEMO_MODE: "false"

  RETENTION_RAW_DAYS: "7"
  RETENTION_AGGREGATED_DAYS: "90"
  RETENTION_SUMMARY_DAYS: "365"

  COST_PER_GPU_HOUR: "2.50"
  COST_CURRENCY: "USD"
  ENERGY_COST_PER_KWH: "0.12"

  LLM_PROVIDER: "none"
  LLM_MODEL: "gpt-4o-mini"
  PROMETHEUS_URL: "http://prometheus-operated.monitoring:9090"
