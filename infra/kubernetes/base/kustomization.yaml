apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nvo

commonLabels:
  app.kubernetes.io/part-of: nvidia-ai-performance-observatory
  app.kubernetes.io/managed-by: kustomize

resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 10-api.yaml
  - 11-web.yaml
  - 12-telemetry-agent.yaml
  - 13-inference-gateway.yaml
  - 20-dependencies.yaml
  - 30-networkpolicy.yaml
  - 40-ingress.yaml

# 02-secret.example.yaml is intentionally excluded: create secrets
# out-of-band rather than committing them.
