apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nvo
  namespace: nvo
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket upgrades for the live telemetry stream.
    nginx.ingress.kubernetes.io/websocket-services: "nvo-api"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["observatory.example.com"]
      secretName: nvo-tls
  rules:
    - host: observatory.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: nvo-api
                port: { number: 8000 }
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: nvo-api
                port: { number: 8000 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nvo-web
                port: { number: 3000 }
