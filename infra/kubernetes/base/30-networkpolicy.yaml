# Default-deny ingress, then allow only the paths the platform needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: nvo
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress
  namespace: nvo
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: nvo-api }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: nvo-web }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: nvo-telemetry-agent }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: nvo-inference-gateway }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports:
        - port: 8000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-datastore-ingress
  namespace: nvo
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["postgres", "redis"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: nvo-api }
      ports:
        - port: 5432
          protocol: TCP
        - port: 6379
          protocol: TCP
