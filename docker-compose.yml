# Local / single-host deployment: PostgreSQL + FastAPI backend + nginx-served frontend.
#
#   docker compose up --build        then open http://localhost:8080
#
# Works without a .env file (demo mode, local-only ports). Copy .env.example to .env to change settings.
# Ports bind to 127.0.0.1 by default because the app has no built-in login; see DEPLOYMENT.md.

name: ai-inference-observatory

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-observatory}
      POSTGRES_USER: ${POSTGRES_USER:-observatory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-observatory}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-observatory}:${POSTGRES_PASSWORD:-observatory}@db:5432/${POSTGRES_DB:-observatory}}
    depends_on:
      db:
        condition: service_healthy
    # Lets models on the Docker host (e.g. Ollama or vLLM on :11434 / :8000) be registered as
    # http://host.docker.internal:<port>/v1 — "localhost" inside the container is the container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"

volumes:
  postgres-data:
