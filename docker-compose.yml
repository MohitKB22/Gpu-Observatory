# NVIDIA AI Performance Observatory — full local stack.
#
# Starts frontend, backend, PostgreSQL, Redis, Prometheus, Grafana, the
# inference gateway and a demo workload generator. No NVIDIA hardware is
# required: the stack starts in Demo Mode with clearly labelled synthetic
# telemetry. See docs/DEPLOYMENT.md for enabling real GPU telemetry via the
# NVIDIA Container Toolkit.

name: nvidia-ai-performance-observatory

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: nvo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nvo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nvo_local_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-nvo}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nvo} -d ${POSTGRES_DB:-nvo}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    networks: [nvo]

  redis:
    image: redis:7.4-alpine
    container_name: nvo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging
    networks: [nvo]

  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: nvo-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nvo}:${POSTGRES_PASSWORD:-nvo_local_dev_password}@postgres:5432/${POSTGRES_DB:-nvo}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-any-real-deployment-0123456789}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    logging: *default-logging
    networks: [nvo]

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: nvo-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nvo}:${POSTGRES_PASSWORD:-nvo_local_dev_password}@postgres:5432/${POSTGRES_DB:-nvo}
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      ENVIRONMENT: ${ENVIRONMENT:-local}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-any-real-deployment-0123456789}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@localhost}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-this-admin-password}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_SCENARIO: ${DEMO_SCENARIO:-healthy}
      DEMO_GPU_COUNT: ${DEMO_GPU_COUNT:-4}
      GPU_METRICS_ENABLED: ${GPU_METRICS_ENABLED:-true}
      DCGM_ENABLED: ${DCGM_ENABLED:-false}
      TELEMETRY_INTERVAL_SECONDS: ${TELEMETRY_INTERVAL_SECONDS:-5}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      COST_PER_GPU_HOUR: ${COST_PER_GPU_HOUR:-2.50}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging
    networks: [nvo]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: nvo-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging: *default-logging
    networks: [nvo]

  inference-gateway:
    build:
      context: .
      dockerfile: ./services/inference-gateway/Dockerfile
    container_name: nvo-inference-gateway
    restart: unless-stopped
    environment:
      NVO_API_URL: http://api:8000
      NVO_API_KEY: ${GATEWAY_API_KEY:-}
      INFERENCE_BACKEND: ${INFERENCE_BACKEND:-local}
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:-}
      DATA_SOURCE: ${GATEWAY_DATA_SOURCE:-production}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-any-real-deployment-0123456789}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging
    networks: [nvo]

  # Optional: a DaemonSet-equivalent agent for real GPU nodes. Disabled by
  # default because the base stack must not require NVIDIA hardware.
  # Enable with:  docker compose --profile gpu up
  telemetry-agent:
    build:
      context: .
      dockerfile: ./services/telemetry-agent/Dockerfile
    container_name: nvo-telemetry-agent
    profiles: ["gpu"]
    restart: unless-stopped
    environment:
      NVO_API_URL: http://api:8000
      NVO_API_KEY: ${AGENT_API_KEY:-}
      TELEMETRY_INTERVAL_SECONDS: ${TELEMETRY_INTERVAL_SECONDS:-5}
      DATA_SOURCE: production
      NODE_NAME: ${NODE_NAME:-docker-host}
    depends_on:
      api:
        condition: service_healthy
    # Requires the NVIDIA Container Toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging: *default-logging
    networks: [nvo]

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: nvo-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - api
    logging: *default-logging
    networks: [nvo]

  grafana:
    image: grafana/grafana:11.4.0
    container_name: nvo-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    logging: *default-logging
    networks: [nvo]

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  nvo:
    driver: bridge
